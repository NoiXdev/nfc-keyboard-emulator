# Dependency updates for the three ecosystems this repo uses.
#
# Minor and patch updates are grouped into one PR per ecosystem per week, so this
# stays reviewable instead of producing a PR per package. Major updates are left
# ungrouped on purpose - those need to be looked at individually.
#
# The `chore` prefix is deliberate: it satisfies the Conventional Commits
# convention the release tooling relies on, and `chore(deps):` does not trigger a
# version bump in the changelog workflow. Dependency updates should not force a
# release on their own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # Cargo.toml lives in the Tauri sidecar, not the repo root.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        update-types: ["minor", "patch"]
        patterns: ["*"]
